<body>
  <div class="auth-shell">
    <section class="auth-visual">
      <div>
        <h1 class="brand-mark">Finlytics<span>.</span></h1>
        <p>
          سامانه تحلیل و گزارش امور مالی با الهام از تجربه محصول‌های نصف جهان —
          ورودی و خروجی، سودآوری، حقوق پرسنل و گزارش صوتی روزانه برای مدیرعامل.
        </p>
      </div>
    </section>
    <section class="auth-panel">
      <form class="auth-card" id="loginForm">
        <h1>ورود به پنل</h1>
        <p class="sub">برای مشاهده داشبورد، نمودارها و تولید ویس گزارش روزانه وارد شوید.</p>
        <div id="errorBox" class="error-box hidden"></div>
        <div class="field">
          <label for="phone">شماره موبایل</label>
          <input id="phone" name="phone" inputmode="tel" value="" autocomplete="username" placeholder="مثلاً ۰۹۱۲۳۴۵۶۷۸۹" required />
        </div>
        <div class="field">
          <label for="password">رمز عبور</label>
          <input id="password" name="password" type="password" value="" autocomplete="current-password" placeholder="رمز عبور" required />
        </div>
        <button class="btn btn-block" type="submit" id="loginBtn">ورود</button>
        <div class="auth-foot">
          محصول
          <a href="https://nesfejahan.com" target="_blank" rel="noopener noreferrer">شرکت تجارت رایانه نصف جهان</a>
          <br />
          تماس: <a href="tel:09199900095" dir="ltr">۰۹۱۹۹۹۰۰۰۹۵</a>
        </div>
      </form>
    </section>
  </div>
  <script>
    if (
      location.protocol === 'http:' &&
      location.hostname !== 'localhost' &&
      location.hostname !== '127.0.0.1' &&
      location.hostname !== '[::1]'
    ) {
      location.replace('https://' + location.host + location.pathname + location.search + location.hash);
    }
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const loginBtn = document.getElementById('loginBtn');

    function toEnDigits(value) {
      return String(value ?? '')
        .replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
        .replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    async function resolveLoginUrl() {
      try {
        const r = await fetch('/api/index.php?path=version', { cache: 'no-store' });
        if (r.ok) return '/api/index.php?path=' + encodeURIComponent('auth/login');
      } catch (_) {}
      return '/api/auth/login';
    }

    if (localStorage.getItem('finlytics_token')) {
      location.href = '/app.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      loginBtn.disabled = true;
      try {
        const phone = toEnDigits(document.getElementById('phone').value).trim().replace(/[\s-]/g, '');
        const password = toEnDigits(document.getElementById('password').value);
        const loginUrl = await resolveLoginUrl();
        const res = await fetch(loginUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=utf-8' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'ورود ناموفق بود');
        localStorage.setItem('finlytics_token', data.access_token);
        localStorage.setItem('finlytics_user', JSON.stringify({
          full_name: data.full_name,
          phone: data.phone
        }));
        document.cookie = `access_token=${data.access_token}; path=/; max-age=${60*60*24*7}; SameSite=Lax`;
        location.href = '/app.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
